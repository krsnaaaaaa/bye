<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bye Princess — Player (Cross-device Likes)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Basic layout ---------- */
  :root{
    --bg:#0b0a14;
    --card: rgba(255,255,255,0.06);
    --accent1:#ff9cd1;
    --accent2:#ffb7e5;
    --text:#ffeef8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background: radial-gradient(circle at top left,#0b0710 0%, #060511 70%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins',sans-serif;
    color:var(--text);
  }
  .player{
    width: min(380px, 92%);
    background:var(--card);
    padding:26px;
    border-radius:20px;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow: 0 10px 40px rgba(255,120,185,0.06), inset 0 1px 0 rgba(255,255,255,0.02);
    position:relative;
    overflow:visible;
  }

  .pfp{
    width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #ffb7e5;box-shadow:0 8px 30px rgba(255,137,201,0.12);
    margin:0 auto 12px; display:block;
  }

  h1{ font-family: 'Monotype Corsiva', cursive; color:#ff97dd; text-shadow:0 0 14px rgba(255,150,200,0.12); font-size:28px; margin-bottom:6px }

  .now-playing{ color:#ffd9f6; font-size:14px; opacity:0.9; margin-bottom:12px }

  /* Wave bars */
  .wave{ display:flex; gap:6px; justify-content:center; align-items:flex-end; height:44px; margin:18px 0}
  .bar{ width:8px; height:12px; border-radius:4px; background:linear-gradient(to top,var(--accent1),var(--accent2)); transform-origin:bottom; animation: bounce 900ms ease-in-out infinite paused; }
  .wave.playing .bar{ animation-play-state:running; }
  .bar:nth-child(2){ animation-delay:0.05s } .bar:nth-child(3){ animation-delay:0.15s } .bar:nth-child(4){ animation-delay:0.25s } .bar:nth-child(5){ animation-delay:0.35s }
  @keyframes bounce { 0%,100%{height:12px} 50%{height:42px} }

  /* controls */
  .controls{ display:flex; gap:16px; justify-content:center; align-items:center; margin-top:12px; }
  .btn{ width:64px;height:64px;border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; font-size:24px; cursor:pointer; box-shadow:0 8px 30px rgba(255,110,180,0.12); display:flex; align-items:center; justify-content:center; transition:transform .15s ease}
  .btn:active { transform:scale(.96) }

  /* like section */
  .like-section{ display:flex; align-items:center; gap:12px; margin-left:6px; }
  .heart{ font-size:34px; cursor:pointer; user-select:none; transition:transform .18s ease, text-shadow .18s ease; color:#ffdff0; }
  .heart:hover{ transform:scale(1.07) }
  .heart.liked { transform:scale(1.22); color:#ff5fa7; text-shadow:0 0 16px rgba(255,95,167,0.45) }

  .like-count{ font-weight:600; font-size:18px; color:#ffd6ee; min-width:34px; text-align:left }

  /* progress */
  .progress{ width:100%; margin-top:10px }
  input[type="range"]{ width:100%; height:6px; background:rgba(255,255,255,0.06); border-radius:6px; -webkit-appearance:none; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%; background:var(--accent1); box-shadow:0 0 12px rgba(255,150,200,0.18) }

  /* confetti container */
  .confetti{ position:fixed; pointer-events:none; z-index:9999; font-size:20px }

  /* small note */
  .note{ font-size:12px; color:#ffcfe6; opacity:0.9; margin-top:10px }
</style>
</head>
<body>

<div class="player" id="player">
  <img src="https://raw.githubusercontent.com/krsnaaaaaa/bye/main/girl.jpeg" alt="pfp" class="pfp">
  <h1>Bye Princess</h1>
  <div class="now-playing" id="nowPlaying">Now Playing — Alvida</div>

  <div class="wave" id="wave">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="progress">
    <input id="progress" type="range" value="0" min="0" max="100">
  </div>

  <div class="controls" style="margin-top:10px">
    <button class="btn" id="playBtn" title="Play/Pause">▶</button>

    <div class="like-section" title="Like (one device = one like)">
      <span id="heart" class="heart">♡</span>
      <span id="likeCount" class="like-count">0</span>
    </div>
  </div>

  <div class="note">Likes sync across devices (via JSONBin). If it doesn't update instantly — refresh or check bin CORS/settings.</div>

  <audio id="audio" preload="metadata">
    <source src="https://raw.githubusercontent.com/krsnaaaaaa/songs/main/alvida.mpeg" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</div>

<script>
/* ===========================
   CONFIG — EDIT NOTHING UNLESS YOU KNOW
   =========================== */
const API_CONFIG = {
  binId: "6922d0f0ae596e708f6b5adc",
  apiKey: "$2a$10$uCOQJE2ozwzF2wMo9TbeFebUI1m0d02MbELLOU.dGelaZxGqAIeHy", // X-Access-Key
  baseUrl: "https://api.jsonbin.io/v3/b"
};
const SYNC_INTERVAL = 3000; // ms

/* ===========================
   DEVICE ID (unique per browser)
   =========================== */
function getDeviceId(){
  let id = localStorage.getItem('deviceId_v1');
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2,12) + '_' + Date.now().toString(36);
    localStorage.setItem('deviceId_v1', id);
  }
  return id;
}
const deviceId = getDeviceId();

/* ===========================
   App DOM
   =========================== */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const wave = document.getElementById('wave');
const progress = document.getElementById('progress');
const heart = document.getElementById('heart');
const likeCountEl = document.getElementById('likeCount');
const player = document.getElementById('player');

/* ===========================
   Local state
   =========================== */
let likes = 0;
let likedUsers = new Set();
let isLiked = false;
let isSaving = false;
let isLoading = true;

/* Determine if we should use the API */
const USE_API = API_CONFIG.binId && API_CONFIG.apiKey && API_CONFIG.binId.trim().length > 10;

/* ---------------------------
   Helper: safe fetch wrapper
   --------------------------- */
async function safeFetch(url, opts = {}, timeout = 8000){
  const controller = new AbortController();
  const id = setTimeout(()=> controller.abort(), timeout);
  try {
    const res = await fetch(url, {...opts, signal: controller.signal});
    clearTimeout(id);
    return res;
  } catch(e){
    clearTimeout(id);
    throw e;
  }
}

/* ===========================
   Load likes from API or local
   =========================== */
async function loadLikes(){
  isLoading = true;
  updateLikeUILoading();
  try {
    if(USE_API){
      const res = await safeFetch(`${API_CONFIG.baseUrl}/${API_CONFIG.binId}/latest`, {
        method:'GET',
        headers: {
          'X-Access-Key': API_CONFIG.apiKey
        }
      }, 9000);

      if(res.ok){
        const json = await res.json();
        const record = json.record || {};
        likes = Number(record.likes || 0);
        likedUsers = new Set(record.likedUsers || []);
        isLiked = likedUsers.has(deviceId);
        persistLocal();
        updateUI();
        isLoading = false;
        return;
      } else {
        console.warn('JSONBin read non-ok', res.status);
      }
    }
  } catch(err){
    console.warn('Load likes - API error, falling back to local', err);
  }

  // fallback localStorage
  likes = Number(localStorage.getItem('likes_v1') || 0);
  try {
    likedUsers = new Set(JSON.parse(localStorage.getItem('likedUsers_v1') || '[]'));
  } catch(e){ likedUsers = new Set(); }
  isLiked = likedUsers.has(deviceId);
  isLoading = false;
  updateUI();
}

/* ===========================
   Save likes (local + API)
   =========================== */
function persistLocal(){
  try {
    localStorage.setItem('likes_v1', String(likes));
    localStorage.setItem('likedUsers_v1', JSON.stringify([...likedUsers]));
  } catch(e) {
    console.warn('Local persist failed', e);
  }
}

async function saveLikes(){
  // Prevent parallel saves
  if (isSaving) return;
  isSaving = true;
  persistLocal();

  if(!USE_API){
    isSaving = false;
    return;
  }

  // Prepare body
  const body = {
    likes,
    likedUsers: [...likedUsers],
    updatedAt: new Date().toISOString()
  };

  try {
    const res = await safeFetch(`${API_CONFIG.baseUrl}/${API_CONFIG.binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Key': API_CONFIG.apiKey
      },
      body: JSON.stringify(body)
    }, 10000);

    if(!res.ok){
      console.warn('Save likes non-ok', res.status);
    }
  } catch(err){
    console.warn('Save likes failed', err);
  } finally {
    isSaving = false;
  }
}

/* ===========================
   Sync loop (pull latest)
   =========================== */
let syncTimer = null;
async function syncLikes(){
  if(!USE_API) return;
  try {
    const res = await safeFetch(`${API_CONFIG.baseUrl}/${API_CONFIG.binId}/latest`, {
      method: 'GET',
      headers: {'X-Access-Key': API_CONFIG.apiKey}
    }, 9000);

    if(res.ok){
      const json = await res.json();
      const record = json.record || {};
      const newLikes = Number(record.likes || 0);
      const newSet = new Set(record.likedUsers || []);
      const newIsLiked = newSet.has(deviceId);

      // update only if different
      if(newLikes !== likes || newIsLiked !== isLiked){
        likes = newLikes;
        likedUsers = newSet;
        isLiked = newIsLiked;
        persistLocal();
        updateUI();
      }
    }
  } catch(err){
    // silent fail - will try again next tick
    //console.warn('sync error', err);
  }
}

function startSyncLoop(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(syncLikes, SYNC_INTERVAL);
}

/* ===========================
   UI updates
   =========================== */
function updateLikeUILoading(){
  likeCountEl.textContent = '...';
  heart.style.pointerEvents = 'none';
}

function updateUI(){
  likeCountEl.textContent = String(likes);
  heart.style.pointerEvents = 'auto';
  if(isLiked){
    heart.classList.add('liked');
    heart.textContent = '❤️';
  } else {
    heart.classList.remove('liked');
    heart.textContent = '♡';
  }
}

/* ===========================
   Confetti (small)
   =========================== */
function createConfetti(){
  const emojis = ['✨','💖','🌸','💫','⭐','🎀','🌺','💝'];
  const count = 18;
  const rect = player.getBoundingClientRect();
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2.2;

  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = centerX + 'px';
    el.style.top = centerY + 'px';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.fontSize = (12 + Math.random()*18) + 'px';
    document.body.appendChild(el);

    const angle = Math.random()*Math.PI*2;
    const dist = 50 + Math.random()*140;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;

    el.animate([
      { transform: 'translate(0,0) scale(1)', opacity:1 },
      { transform: `translate(${dx}px, ${dy}px) scale(.4) rotate(${Math.random()*720}deg)`, opacity:0 }
    ], { duration: 800 + Math.random()*700, easing: 'cubic-bezier(.2,.7,.2,1)' })
    .onfinish = ()=> el.remove();
  }
}

/* ===========================
   Heart click (like/unlike)
   =========================== */
heart.addEventListener('click', async ()=>{
  if(isLoading || isSaving) return;

  // optimistic update
  const prevLikes = likes;
  const prevUsers = new Set(likedUsers);
  const prevIsLiked = isLiked;

  if(!isLiked){
    likes = Math.max(0, likes + 1);
    likedUsers.add(deviceId);
    isLiked = true;
    createConfetti();
  } else {
    likes = Math.max(0, likes - 1);
    likedUsers.delete(deviceId);
    isLiked = false;
  }
  updateUI();

  try {
    await saveLikes();      // attempt to save
    await syncLikes();      // then pull to ensure consistency
  } catch(e){
    // revert on persistent failure
    likes = prevLikes;
    likedUsers = prevUsers;
    isLiked = prevIsLiked;
    updateUI();
  }
});

/* ===========================
   Audio controls + progress
   =========================== */
playBtn.addEventListener('click', ()=>{
  if(audio.paused){ audio.play(); playBtn.textContent='⏸'; wave.classList.add('playing'); }
  else { audio.pause(); playBtn.textContent='▶'; wave.classList.remove('playing'); }
});

audio.addEventListener('timeupdate', ()=>{
  if(audio.duration) progress.value = (audio.currentTime/audio.duration)*100;
});

progress.addEventListener('input', ()=>{
  if(audio.duration) audio.currentTime = (progress.value/100) * audio.duration;
});

/* ===========================
   Init
   =========================== */
(async function init(){
  updateLikeUILoading();
  await loadLikes();
  updateUI();
  if(USE_API) startSyncLoop();
})();

/* cleanup */
window.addEventListener('beforeunload', ()=>{
  if(syncTimer) clearInterval(syncTimer);
});
</script>
</body>
</html>
